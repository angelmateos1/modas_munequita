<div class="login-wrapper fondo-lunares">
  <div class="login-card">
    <img src="logo.png" alt="Logo Modas Muñequita" class="login-logo" />
    <h2>Bienvenida</h2>
    <p class="subtitulo">Inicia sesión en Modas Muñequita</p>

    <form (ngSubmit)="iniciarSesion()">
      <div class="campo">
        <label>Correo electrónico</label>
        <input type="email" [(ngModel)]="email" name="email" required placeholder="tu@correo.com" />
      </div>

      <div class="campo">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="password" name="password" required placeholder="••••••" />
      </div>

      @if (error()) {
        <p class="mensaje-error">{{ error() }}</p>
      }

      <button type="submit" class="btn-primario btn-full">Entrar</button>
    </form>
  </div>
</div>
