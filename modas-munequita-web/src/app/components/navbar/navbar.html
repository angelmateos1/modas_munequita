<header class="navbar">
  <a routerLink="/" class="marca">
    <img src="logo.png" alt="Modas Muñequita" class="logo-img" />
    <span class="brand-title">Modas Muñequita</span>
  </a>

  <nav class="nav-links">
    <a routerLink="/" routerLinkActive="nav-activo" [routerLinkActiveOptions]="{ exact: true }">
      Catálogo
    </a>

    @if (authService.esAdmin()) {
      <a routerLink="/admin/clientes" routerLinkActive="nav-activo">
        Panel Dita
      </a>
    }

    @if (authService.usuarioActual(); as user) {
      <span class="saludo">Hola, {{ user.nombreCompleto }}</span>
      <button (click)="cerrarSesion()" class="btn-secundario">Salir</button>
    } @else {
      <a routerLink="/login" class="btn-primario">Entrar</a>
    }
  </nav>
</header>
